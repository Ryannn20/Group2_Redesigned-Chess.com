<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess.com Current UI – HCI Prototype (Task 1)</title>
<style>
:root{
  --bg:#302e2b; --panel:#262522; --deep:#21201d; --btn:#3c3a37; --btn-edge:#2b2a28;
  --green:#81b64c; --gedge:#45753c; --muted:#c3c2c1; --dim:#989795;
  --light:#ebecd0; --dark:#739552;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#161512;color:#fff;
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- prototype chrome (outside the Chess.com UI) ---------- */
#protobar{position:fixed;top:0;left:0;right:0;height:40px;background:#161512;border-bottom:1px solid #2a2927;
  display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;z-index:10}
#protobar .tag{color:#8b8987;margin-right:10px}
#protobar button{padding:6px 12px;border-radius:5px;background:#2a2927;color:#c3c2c1;font-weight:600}
#protobar button:hover{background:#3a3835}
#protobar button.on{background:#81b64c;color:#fff}
#note{margin-left:auto;color:#a7a6a4;opacity:0;transition:opacity .25s}
#note.show{opacity:1}
#view{position:fixed;top:40px;left:0;right:0;bottom:0;overflow:hidden;background:#302e2b}
#stage{position:absolute;left:0;top:0;width:1906px;height:873px;transform-origin:0 0;background:var(--bg);overflow:hidden}

/* ---------- sidebar ---------- */
.sidebar{position:absolute;left:0;top:0;width:206px;height:100%;background:var(--panel)}
.logo{position:absolute;left:14px;top:14px;height:42px;display:flex;align-items:center;cursor:pointer}
.logo .wm{font-size:34px;font-weight:800;letter-spacing:-1.6px;color:#fff;margin-left:-10px;position:relative;top:-1px}
.logo .wm small{font-size:23px;font-weight:600;color:#c3c2c1;letter-spacing:-.6px}
.sb-item{position:absolute;left:0;width:206px;height:46px;display:flex;align-items:center;gap:14px;padding-left:13px;
  font-size:18px;font-weight:700;color:#d2d1cf;cursor:pointer}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.blue span{color:#3fb0ee}
.sb-ico{width:30px;height:30px;display:grid;place-items:center;flex:none}
.sb-b{position:absolute;left:0;width:206px;height:40px;display:flex;align-items:center;gap:14px;padding-left:13px;
  font-size:16px;font-weight:600;color:#a7a6a4;cursor:pointer}
.sb-b:hover{color:#fff}
.sb-row{position:absolute;left:0;bottom:12px;width:206px;height:34px}
.sb-row a{position:absolute;top:2px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;opacity:.9}
.sb-row a:hover{opacity:1}
.badge{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:#e02828;color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- avatars / small bits ---------- */
.av{background:#cfcdc9;border-radius:3px;display:grid;place-items:end center;overflow:hidden;flex:none}
.flag{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:-2px;
  background:linear-gradient(#2f5fd0 0 50%,#d8392f 50% 100%);position:relative;overflow:hidden}
.flag::before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:7px 0 7px 10px;border-color:transparent transparent transparent #fff}
.bars{display:inline-flex;gap:2px;margin-left:6px;vertical-align:1px}
.bars i{width:4px;height:11px;border-radius:1px;background:#e8e7e5}
.bars i.off{background:#6a6967}

/* ---------- boards ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);user-select:none;flex:none}
.sq{position:relative}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.board.grass .sq.l{background:#a9d86a} .board.grass .sq.d{background:#93c653}
.sq .pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sq .rk,.sq .fl{position:absolute;font-weight:700;font-size:var(--cf,14px);line-height:1;pointer-events:none}
.sq .rk{left:.38em;top:.34em} .sq .fl{right:.32em;bottom:.28em}
.sq.l .rk,.sq.l .fl{color:var(--dark)} .sq.d .rk,.sq.d .fl{color:var(--light)}
.sq.hl.l{background:#f5f682} .sq.hl.d{background:#b9ca43}
.sq .dot{position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,.14);pointer-events:none}
.sq .ring{position:absolute;inset:0;background:radial-gradient(circle,transparent 0,transparent 63%,rgba(0,0,0,.14) 64%);pointer-events:none}
.board.live .sq{cursor:pointer}
.sq .bdg{position:absolute;right:-9px;top:-11px;z-index:3;width:30px;height:30px;border-radius:50%;background:#fa412d;
  color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.board .over{position:absolute;inset:0;pointer-events:none;z-index:2}

/* ---------- generic buttons / panels ---------- */
.gbtn{background:var(--green);border-bottom:4px solid var(--gedge);border-radius:8px;color:#fff;font-weight:700;
  text-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.gbtn:hover{filter:brightness(1.07)}
.gbtn:active{transform:translateY(2px);border-bottom-width:2px}
.mbtn{background:var(--btn);border-bottom:4px solid var(--btn-edge);border-radius:8px;font-weight:700;display:flex;
  align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center}
.mbtn:hover{background:#464441}
.mbtn:active{transform:translateY(2px);border-bottom-width:2px}
.pnl{position:absolute;background:var(--panel);border-radius:8px;overflow:hidden}

/* ---------- Screen 1: home ---------- */
.main{position:absolute;left:206px;top:0;right:0;bottom:0}
.scroll{overflow-y:scroll}
.scroll::-webkit-scrollbar{width:18px}
.scroll::-webkit-scrollbar-track{background:#2a2927}
.scroll::-webkit-scrollbar-thumb{background:#7d7c7a;border:3px solid #2a2927;border-radius:7px}
.home-wrap{margin-left:181px;width:1315px;padding-bottom:30px}
.home-head{height:78px;display:flex;align-items:center;padding-top:0;position:relative}
.home-head .uname{font-size:21px;font-weight:700;margin-left:20px;margin-right:10px}
.streak{position:absolute;right:0;top:0;height:78px;display:flex;align-items:center;gap:14px;font-size:29px;font-weight:700}
.big{position:relative;height:510px;background:var(--panel);border-radius:8px;padding:15px;display:flex;gap:15px}
.po{width:310px;flex:none}
.po h2{font-size:22px;font-weight:700;height:30px;line-height:24px;margin-bottom:10px}
.tc{display:flex;gap:7px;margin-bottom:13px}
.tc button{height:52px;border-radius:7px;background:#3a3835;font-weight:600;font-size:17px;border:2px solid transparent}
.tc button:nth-child(1){width:103px;margin-right:0}.tc button:nth-child(2){width:97px}.tc button:nth-child(3){width:97px}
.tc button.on{border-color:var(--green);background:#2f2d2a}
.po .start{width:310px;height:60px;font-size:23px;margin-bottom:30px}
.po .mbtn{width:310px;height:60px;font-size:23px;margin-bottom:10px}
.hcard{width:310px;height:480px;background:#302e2b;border-radius:6px;overflow:hidden;flex:none;position:relative}
.hcard .board{width:310px;height:310px}
.hcard .row{display:flex;align-items:center;gap:10px;padding:0 20px;height:76px;margin-top:0}
.hcard .row .t{font-size:17px;font-weight:600}
.hcard .row .t small{font-weight:400;color:#c3c2c1;font-size:17px}
.hcard .prog{height:20px;width:210px;background:#3d3b39;border-radius:6px;margin-top:6px}
.hcard .mbtn{position:absolute;left:20px;top:400px;width:270px;height:60px;font-size:22px;background:#3d3b39}
.sec-row{display:flex;gap:30px;margin-top:25px}
.sec{background:var(--panel);border-radius:8px;padding:15px;position:relative}
.sec h3{font-size:22px;font-weight:700;height:30px;display:flex;align-items:center;gap:8px}
.sec h3 .n{width:16px;height:16px;border-radius:50%;border:1.5px solid #bbb;font-size:10px;display:grid;place-items:center;font-weight:600;color:#ccc}
.rec{width:910px;height:260px}
.rec .menu{position:absolute;right:30px;top:17px;cursor:pointer;opacity:.9}
.rm{position:absolute;left:15px;top:60px;width:433px;height:200px;display:flex}
.rm .mini{width:200px;height:200px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);position:relative;flex:none}
.rm .mini i.l{background:var(--light)} .rm .mini i.d{background:var(--dark)}
.rm .mav{position:absolute;left:57px;top:57px;width:86px;height:86px;border-radius:6px;background:#cfcdc9;border:3px solid #e9e8e6;
  display:grid;place-items:end center;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rm .info{padding-left:20px;padding-top:20px;width:233px}
.rm .nm{font-size:17px;font-weight:600;letter-spacing:.01em;height:24px}
.rm .sub{font-size:16px;color:#c3c2c1;margin-top:6px}
.rm .tag{display:inline-block;margin-top:14px;padding:0 6px;height:24px;line-height:24px;font-size:14px;font-weight:700;
  letter-spacing:.04em;color:#81b64c;background:rgba(129,182,76,.18);border-radius:3px}
.rm .gbtn{width:193px;height:50px;font-size:18px;margin-top:20px;font-weight:600}
.rm .x{position:absolute;left:414px;top:2px;width:26px;height:26px;border-radius:50%;background:#3c3a37;display:grid;place-items:center;
  color:#ddd;font-size:19px;cursor:pointer;line-height:1}
.dp{width:375px;height:420px}
.dp .board{position:absolute;left:15px;top:60px;width:345px;height:345px;cursor:pointer}

/* ---------- game screens (2,3) ---------- */
.gcol{position:absolute}
.prow{display:flex;align-items:flex-start;height:50px}
.prow .info{padding:4px 0 0 12px;font-size:17px;font-weight:700;line-height:20px;flex:1}
.prow .info .r{font-weight:400;color:#c3c2c1}
.clock{height:50px;width:174px;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding-right:14px;
  font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;background:#262522;color:#85837f}
.clock.active{background:#fff;color:#262522}
.clock.white{color:#fff}
.clock.gray{background:#85837f;color:#3b3a38}
.clock svg{margin-right:auto;margin-left:14px}
.gear{position:absolute;opacity:.55;cursor:pointer}
.gpanel{left:1019px;top:15px;width:469px;height:833px;display:flex;flex-direction:column}
.gtabs{height:72px;display:flex;background:#21201d}
.gtabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:600;
  color:#bdbcba;cursor:pointer}
.gtabs div.on{color:#fff;background:#2b2a27}
.gtabs div:hover{color:#fff}
.subtabs{height:70px;display:flex;border-bottom:1px solid #3a3835;margin-bottom:0;position:relative}
.subtabs div{flex:1;display:grid;place-items:center;font-size:19px;font-weight:600;color:#c3c2c1;cursor:pointer;position:relative;padding-bottom:2px}
.subtabs div.on{color:#fff}
.subtabs div.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#d2d1cf}
.movehead{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 19px;font-size:16px;font-weight:600;
  color:#c3c2c1;border-bottom:1px solid #353431}
.movelist{flex:1;overflow-y:auto}
.mrow{display:grid;grid-template-columns:54px 1fr 1fr;height:38px;align-items:center;font-size:17px;font-weight:700}
.mrow:nth-child(even){background:#292825}
.mrow .n{background:#21201d;color:#8b8987;text-align:center;height:100%;line-height:38px;font-weight:600}
.mrow .m{padding-left:18px;display:flex;align-items:center;gap:3px;height:100%;cursor:pointer}
.mrow .m:hover{background:#3a3835}
.mrow .m.cur{background:#454340}
.fig{display:inline-block;width:20px;height:20px}
.matchinfo{text-align:center;font-size:16px;line-height:26px;color:#c3c2c1;padding-bottom:18px}
.matchinfo b{color:#fff;font-weight:600}
.gbottom{height:140px;background:#2b2a27;padding:20px 20px 0;display:flex;flex-direction:column;gap:0}
.ctrls{display:flex;gap:8px;justify-content:center;height:60px}
.ctrls button{width:79px;height:60px;border-radius:7px;background:#3d3b39;border-bottom:4px solid #2b2a28;display:grid;place-items:center}
.ctrls button:hover{background:#4a4845}
.ctrls button.big{width:79px;background:#4b4947}
.gfoot{display:flex;align-items:center;gap:20px;margin-top:20px;padding:0 0 0 0;font-size:17px;font-weight:600;color:#c3c2c1;position:relative}
.gfoot span{display:flex;align-items:center;gap:6px;cursor:pointer}
.gfoot span:hover{color:#fff}
.gfoot .flip{position:absolute;right:2px;top:-3px}

/* review */
.evalbar{position:absolute;left:233px;top:78px;width:37px;height:700px;background:#403d39;border-radius:2px;color:#fff;font-size:11px;font-weight:700}
.evalbar span{position:absolute;left:11px;top:6px}
.rhead{height:60px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:700;position:relative;background:#262522}
.rhead .h{position:absolute;left:14px;top:16px}
.rhead .z{position:absolute;right:12px;top:17px}
.rscroll{flex:1;overflow-y:scroll;padding:30px 14px 0 30px}
.rscroll::-webkit-scrollbar{width:10px}
.rscroll::-webkit-scrollbar-track{background:transparent}
.rscroll::-webkit-scrollbar-thumb{background:#5a5856;border-radius:5px}
.coachrow{display:flex;align-items:flex-end;height:155px}
.bubble{background:#fff;color:#312e2b;font-size:18px;line-height:25px;font-weight:400;border-radius:8px;padding:19px 18px;width:301px;height:155px;position:relative;margin-left:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:54px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.graph{margin-top:20px;width:396px;height:98px;border-radius:4px;overflow:hidden;background:#403d39}
.pl{display:grid;grid-template-columns:1fr 80px 52px 80px;padding-right:33px;margin-top:16px;text-align:center}
.pl .nm{font-size:15px;font-weight:700;height:26px}
.pl .lab{text-align:left;font-size:17px;font-weight:600;align-self:center;color:#e8e7e5}
.pl .box{width:80px;height:80px;border-radius:4px;background:#d3d1cd;display:grid;place-items:end center;overflow:hidden}
.pl .box.g{outline:3px solid var(--green);outline-offset:-3px}
.pl .acc{width:80px;height:45px;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:700;background:#403d39}
.pl .acc.w{background:#fff}
.hr{height:1px;background:#3d3b39;margin:20px 0 0}
.stat{display:grid;grid-template-columns:1fr 66px 66px 66px;height:50px;align-items:center;margin-right:33px;font-size:17px;font-weight:600;
  color:#e8e7e5}
.stat .c{text-align:center;font-size:18px;font-weight:700}
.stat .ic{display:grid;place-items:center}
.rfoot{padding:8px 14px 24px 30px;background:#262522;flex:none}
.rfoot .gbtn{width:409px;height:80px;font-size:28px}

/* ---------- Screen 4: puzzle ---------- */
.ppanel{left:1094px;top:15px;width:394px;height:833px;display:flex;flex-direction:column}
.phead{height:90px;background:#21201d;flex:none;display:flex;align-items:center;padding:0 22px;gap:14px;font-size:35px;font-weight:700;position:relative}
.phead .sp{margin-left:auto;display:flex;align-items:center;gap:30px}
.pbody{flex:1;padding:30px 30px 0;position:relative}
.pcoach{display:flex;align-items:flex-start}
.pbubble{background:#fff;color:#312e2b;border-radius:8px;padding:14px 16px 16px;width:278px;font-size:17.5px;line-height:25px;position:relative;margin-left:-18px;z-index:1}
.pbubble .t{display:flex;align-items:center;gap:12px;font-size:19px;margin-bottom:10px;font-weight:400}
.pbubble .t i{width:28px;height:28px;border:2px solid #9a9997;border-radius:5px;display:grid;place-items:center;flex:none;font-style:normal}
.pbubble .t i.ok{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.pscore{margin-top:26px;font-size:31px;font-weight:700;line-height:36px}
.pbar{display:flex;align-items:center;gap:14px;margin-top:3px}
.pbar .bar{flex:1;height:20px;border-radius:7px;background:#3d3b39;overflow:hidden}
.pbar .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .5s}
.pfoot{height:140px;background:#2b2a27;flex:none;padding:20px 30px 0;position:relative}
.pfoot .mbtn{width:334px;height:60px;font-size:21px;gap:12px}
.pfoot .row{position:absolute;left:30px;right:30px;top:98px;display:flex;align-items:center;gap:20px}
.pfoot .row svg{cursor:pointer;opacity:.85}

/* ---------- Screen 5: play menu ---------- */
.mpanel{left:973px;top:17px;width:519px;height:833px;background:#262522;border-radius:8px;overflow:hidden;position:absolute;display:flex;flex-direction:column}
.mhead{height:90px;flex:none;background:#21201d;display:flex;align-items:center;justify-content:center;gap:20px;font-size:37px;font-weight:700;z-index:2;
  box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mlist{flex:1;overflow-y:scroll;padding:10px 30px 20px 30px}
.mlist::-webkit-scrollbar{width:10px}
.mlist::-webkit-scrollbar-thumb{background:#5a5856;border-radius:5px}
.mlist::-webkit-scrollbar-track{background:transparent}
.mitem{height:125px;margin-bottom:12px;border-radius:7px;background:#32312e;border-bottom:4px solid #272624;display:flex;align-items:center;
  padding:0 30px;gap:24px;cursor:pointer;width:446px}
.mitem:hover{background:#3d3b39}
.mitem .ico{width:64px;height:64px;display:grid;place-items:center;flex:none}
.mitem h4{font-size:28px;font-weight:700;line-height:34px}
.mitem p{font-size:18px;color:#c3c2c1;line-height:24px;margin-top:4px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcdcdc"/></linearGradient>
  <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6b6b"/><stop offset="1" stop-color="#383838"/></linearGradient>
</defs></svg>

<div id="protobar">
  <span class="tag">Prototype · current Chess.com UI</span>
  <button data-go="home">1 · Home</button>
  <button data-go="play">2 · Playing</button>
  <button data-go="review">3 · Game Review</button>
  <button data-go="puzzle">4 · Puzzle</button>
  <button data-go="menu">5 · Play Menu</button>
  <span id="note"></span>
</div>
<div id="view"><div id="stage"></div></div>

<script>
/* =====================================================================
   Chess pieces (inline SVG, drawn in-code — no images, no external assets)
   ===================================================================== */
const PAL_GRASS = {
  w:{f:'#eaf5cf',s:'#55702a',d:'#55702a'},
  b:{f:'#3f7d2e',s:'#1d4519',d:'#9fd07a'}
};
function pieceSVG(t,c,pal){
  const P = pal ? pal[c] : (c==='w'
    ? {f:'url(#gw)',s:'#474747',d:'#474747'}
    : {f:'url(#gb)',s:'#1b1b1b',d:'#b0b0b0'});
  const base='<rect x="22" y="78" width="56" height="12" rx="5"/>';
  const S={
    p:`<path d="M37,52C37,46 41,45 42,42H58C59,45 63,46 63,52C63,62 70,68 74,78H26C30,68 37,62 37,52Z"/>
       <rect x="35" y="40" width="30" height="8" rx="4"/><circle cx="50" cy="28" r="13"/>${base}`,
    r:`<path d="M31,34H69L72,68H28Z"/>
       <path d="M26,12H38V22H44V12H56V22H62V12H74V34H26Z"/>
       <rect x="24" y="66" width="52" height="12" rx="3"/>${base}`,
    n:`<path d="M28,78C28,66 34,62 40,56L24,58C18,58 16,52 20,46L34,32L40,22L44,8L54,20C68,22 82,38 82,62C82,70 80,74 80,78Z"/>${base}`,
    b:`<path d="M50,10C66,24 72,38 66,52C64,56 58,58 50,58C42,58 36,56 34,52C28,38 34,24 50,10Z"/>
       <circle cx="50" cy="10" r="5"/>
       <rect x="34" y="56" width="32" height="9" rx="4.5"/>
       <path d="M40,65C40,72 36,76 30,80H70C64,76 60,72 60,65Z"/>${base}`,
    q:`<path d="M30,70L24,32L36,50L38,24L46,48L50,18L54,48L62,24L64,50L76,32L70,70Z"/>
       <circle cx="24" cy="29" r="5"/><circle cx="38" cy="21" r="5"/><circle cx="50" cy="15" r="5"/>

const FILES='abcdefgh';
function parseFEN(fen){

  moves(r,f){
    const g=this.g,p=g[r][f],out=[]; if(!p)return out;
    const inb=(a,b)=>a>=0&&a<8&&b>=0&&b<8;
    const slide=(dr,df)=>{let a=r+dr,b=f+df;while(inb(a,b)){const q=g[a][b];if(!q)out.push([a,b]);else{if(q.c!==p.c)out.push([a,b]);break}a+=dr;b+=df}};

      case 'n':[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,b])=>step(a,b));break;

function arrowPoly({from,to,color}){

}

function go(id){
  if(!SCREENS[id])id='home';

  $('#stage').innerHTML=SCREENS[id].html();
  SCREENS[id].init();
  document.querySelectorAll('#protobar button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));

function $(s,r=document){return r.querySelector(s)}

  const g=e.target.closest('[data-go]');

function fit(){
  const v=$('#view'),w=v.clientWidth,h=v.clientHeight,s=Math.min(w/1906,h/873);
  $('#stage').style.transform=`translate(${(w-1906*s)/2}px,${(h-873*s)/2}px) scale(${s})`;
}
window.addEventListener('resize',fit);
fit();
go((location.hash||'#home').slice(1));
</script>
</body>
